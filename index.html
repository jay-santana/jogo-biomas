<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura nos Biomas Brasileiros</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <button id="mute-btn" class="mute-btn" style="
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px;
            background: rgba(255, 255, 255, 0.219);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
        ">🔊</button>

        <div class="content">
            <h1>AVENTURA NOS BIOMAS</h1>
            <h2>BRASILEIROS</h2>
            <div class="character">
            </div>
            <div class="buttons">
                <button id="play-btn" class="btn-primary">JOGAR</button>
                <button id="info-btn" class="btn-secondary">INFORMAÇÕES</button>
            </div>
        </div>
    </div>

    <script src="scripts/sounds.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>

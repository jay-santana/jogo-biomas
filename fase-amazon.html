<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Atlântica - Aventura nos Biomas Brasileiros</title>
    <link rel="stylesheet" href="styles/fase.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Amazônia</h1>
            <button id="back-btn" class="back-btn">Voltar às Fases</button>
        </header>
        
        <div class="levels-container">
            <div class="level-card" data-level="1">
                <h3>Nível 1</h3>
                <div class="level-status unlocked">
                    <span>Desbloqueado</span>
                </div>
                <button class="start-btn">Iniciar</button>
            </div>
            
            <div class="level-card" data-level="2">
                <h3>Nível 2</h3>
                <div class="level-status locked">
                    <span>Bloqueado</span>
                </div>
                <button class="start-btn" disabled>Iniciar</button>
            </div>
            
            <div class="level-card" data-level="3">
                <h3>Nível 3</h3>
                <div class="level-status locked">
                    <span>Bloqueado</span>
                </div>
                <button class="start-btn" disabled>Iniciar</button>
            </div>
            
            <div class="level-card" data-level="4">
                <h3>Nível 4</h3>
                <div class="level-status locked">
                    <span>Bloqueado</span>
                </div>
                <button class="start-btn" disabled>Iniciar</button>
            </div>
            
            <div class="level-card" data-level="5">
                <h3>Nível 5</h3>
                <div class="level-status locked">
                    <span>Bloqueado</span>
                </div>
                <button class="start-btn" disabled>Iniciar</button>
            </div>

            <div class="level-card" data-level="6">
                <h3>Nível 6</h3>
                <div class="level-status locked">
                    <span>Bloqueado</span>
                </div>
                <button class="start-btn" disabled>Iniciar</button>
            </div>

        </div>
    </div>

    <script src="scripts/fase.js"></script>
</body>
</html>

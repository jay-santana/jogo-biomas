<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fases - Aventura nos Biomas Brasileiros</title>
    <link rel="stylesheet" href="styles/fases.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <!-- <h1>Escolha um Bioma</h1> -->
        <button id="back-btn" class="back-btn">VOLTAR</button>
      </header>

      <div class="biomes-container">
        <div class="biome-card" data-biome="atlantic">
          <button class="select-btn">MATA ATLANTICA</button>
        </div>

        <div class="biome-card" data-biome="amazon">
          <button class="select-btn">AMAZONIA</button>
        </div>

        <div class="biome-card" data-biome="cerrado">
          <button class="select-btn">CERRADO</button>
        </div>

        <div class="biome-card" data-biome="caatinga">
          <button class="select-btn">CAATINGA</button>
        </div>

        <div class="biome-card" data-biome="pantanal">
          <button class="select-btn">PANTANAL</button>
        </div>
      </div>
    </div>

    <script src="scripts/fases.js"></script>
  </body>
</html>

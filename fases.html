<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fases - Aventura nos Biomas Brasileiros</title>
    <link rel="stylesheet" href="styles/fases.css" />
    <link rel="stylesheet" href="styles/modais.css">
  </head>
  <body>
    <div class="container">
      <header>
        <button id="back-btn" class="back-btn">VOLTAR</button>
         <button id="mute-btn" class="mute-btn" style="
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.219);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4rem;
        ">🔊</button>
      </header>

      <div class="map-container">
        <img src="https://i.im.ge/2025/09/30/n6s1TS.background-fases2.png" alt="Mapa dos Biomas Brasileiros" class="map-image">
        <div class="biomes-overlay">
          <div class="biome-card" data-biome="atlantic">
            <button class="select-btn">MATA ATLANTICA</button>
          </div>
  
          <div class="biome-card" data-biome="amazon">
            <button class="select-btn">AMAZONIA</button>
          </div>
  
          <div class="biome-card" data-biome="cerrado">
            <button class="select-btn">CERRADO</button>
          </div>
  
          <div class="biome-card" data-biome="caatinga">
            <button class="select-btn">CAATINGA</button>
          </div>
  
          <div class="biome-card" data-biome="pantanal">
            <button class="select-btn">PANTANAL</button>
          </div>
        </div>
      </div>

    </div>

    <script src="scripts/sounds.js"></script>
    <script src="scripts/modais.js"></script>
    <script src="scripts/fases.js"></script>
  </body>
</html>

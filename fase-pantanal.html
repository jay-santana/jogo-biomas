<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Atlântica - Aventura nos Biomas Brasileiros</title>
    <link rel="stylesheet" href="styles/fase.css">
</head>
<body class="bioma-pantanal">
    <img src="../assets/NV5/pantanal.png" alt="Imagem de Fundo" class="background-image">
    <header>
        <button id="back-btn" class="back-btn">VOLTAR</button>
    </header>
    <div class="title-container">
        <h1>AVENTURA NOS BIOMAS</h1>
        <h2>PANTANAL</h2>
    </div>
    <div class="container">
        <div class="levels-container">
            <div class="level-card" data-level="1">
              <img src="../assets/NV5/folha.png" alt="Ícone de Folha" class="folha">
                <div class="level-status unlocked"></div>
                <button class="start-btn">1</button>
            </div>
            
            <div class="level-card" data-level="2">
              <img src="../assets/NV5/folha.png" alt="Ícone de Folha" class="folha">
                <div class="level-status locked"></div>
                <button class="start-btn" disabled>2</button>
            </div>
            
            <div class="level-card" data-level="3">
              <img src="../assets/NV5/folha.png" alt="Ícone de Folha" class="folha">
                <div class="level-status locked"></div>
                <button class="start-btn" disabled>3</button>
            </div>
            
            <div class="level-card" data-level="4">
              <img src="../assets/NV5/folha.png" alt="Ícone de Folha" class="folha">
                <div class="level-status locked"></div>
                <button class="start-btn" disabled>4</button>
            </div>
            
            <div class="level-card" data-level="5">
              <img src="../assets/NV5/folha.png" alt="Ícone de Folha" class="folha">
                <div class="level-status locked"></div>
                <button class="start-btn" disabled>5</button>
            </div>

            <div class="level-card" data-level="6">
              <img src="../assets/NV5/folha.png" alt="Ícone de Folha" class="folha">
                <div class="level-status locked"></div>
                <button class="start-btn" disabled>6</button>
            </div>

        </div>
    </div>

    <script src="scripts/fase.js"></script>
</body>
</html>
